services:
  postgres:
    image: postgres:15-alpine
    container_name: pncp_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pncp_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  evolution-api:
    image: evoapicloud/evolution-api:v1.8.7
    container_name: pncp_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-ctamazonia_token_2026}
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  pgdata:
  evolution_instances: